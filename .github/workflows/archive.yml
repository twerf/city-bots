name: archive bars
on:
  schedule:
    - cron: '35 21 * * 1-5' # after the close (4:35pm EST / 5:35pm EDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node research/archive.mjs
      - name: commit
        run: |
          git config user.name "city-bots"
          git config user.email "city-bots@users.noreply.github.com"
          git add archive
          git diff --cached --quiet && exit 0
          git commit -q -m "archive $(date -u +%F)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
